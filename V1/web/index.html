<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Chemin de base, remplacé par la valeur de `--base-href` au moment de
    `flutter build web` (« / » par défaut).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="L'odyssée des vagabonds : création et gestion de personnages de jeu de rôle, campagnes et séances.">
  <meta name="theme-color" content="#1C1916">

  <!-- iPhone et iPad : ajoutée à l'écran d'accueil, l'appli s'ouvre en plein
       écran, avec son nom et son icône. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Odyssée">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>L'odyssée des vagabonds</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #1C1916;">
  <script>
    // Toujours la dernière version (12/11/2026) : on retire le « service
    // worker » des versions précédentes et ses copies de l'application, puis
    // on recharge la page si c'est lui qui l'avait servie. Ensuite seulement,
    // l'application démarre.
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const controlee = !!navigator.serviceWorker.controller;
          for (const r of await navigator.serviceWorker.getRegistrations()) {
            await r.unregister();
          }
          if (window.caches) {
            for (const k of await caches.keys()) {
              if (k.startsWith('flutter-')) await caches.delete(k);
            }
          }
          if (controlee) {
            location.reload();
            return;
          }
        }
      } catch (e) {
        // Navigation privée, accès refusé : on démarre quand même.
      }
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      s.async = true;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
